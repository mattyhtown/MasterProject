name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install "pytest>=8.0.0"
      - name: Syntax check
        run: python -m compileall -q apex_sharpe tests
      - name: Run historian and edge-graduation tests
        run: python -m pytest tests/test_edge_governance.py -v --tb=short
      - name: Run unit test suite
        run: |
          python -m pytest \
            apex_sharpe/tests/test_webhooks.py \
            apex_sharpe/tests/test_unusual_whales.py \
            apex_sharpe/tests/test_ops_agents.py \
            apex_sharpe/tests/test_adaptive_selector.py \
            apex_sharpe/tests/test_executor.py \
            apex_sharpe/tests/test_portfolio.py \
            apex_sharpe/tests/test_research_agents.py \
            apex_sharpe/tests/test_risk.py \
            apex_sharpe/tests/test_signal_sizer.py \
            apex_sharpe/tests/test_strategy_agents.py \
            apex_sharpe/tests/test_tax_margin_treasury.py \
            -q --tb=short

  security-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Config and webhook import smoke test
        run: |
          python -c "from apex_sharpe.config import load_config; cfg = load_config(); assert cfg.webhook.port == 8080"
          python -c "from apex_sharpe.webhooks import WebhookClient, WebhookServer, WebhookRouter; print('Webhooks OK')"
      - name: Run SecurityAgent source scan
        run: |
          python - << 'EOF'
          import sys
          from apex_sharpe.agents.ops import SecurityAgent

          res = SecurityAgent().run({"action": "audit_config", "project_root": "."})
          source_findings = [f for f in res.data["findings"] if f["check"] in ("hardcoded_secret", "gitignore_env")]
          print("Passed:", res.data["passed"])
          if source_findings:
              print("Source security findings:", source_findings)
              sys.exit(1)
          EOF
      - name: Verify webhook server health endpoint
        run: |
          python - << 'EOF'
          import json
          import urllib.request
          from apex_sharpe.config import WebhookCfg
          from apex_sharpe.webhooks import WebhookServer

          with WebhookServer(WebhookCfg(host="127.0.0.1", port=0)) as srv:
              host, port = srv.server_address
              with urllib.request.urlopen(f"http://{host}:{port}/health", timeout=5) as r:
                  assert r.status == 200
                  body = json.loads(r.read().decode())
                  assert body["status"] == "ok"
                  print("Webhook /health OK:", body)
          EOF

  docker:
    runs-on: ubuntu-latest
    needs: [test, security-and-smoke]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: apex-sharpe:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test Docker container
        run: |
          docker run --rm apex-sharpe:ci python -c "from apex_sharpe.config import load_config; from apex_sharpe.webhooks import WebhookClient, WebhookServer; cfg = load_config(); assert cfg.webhook.port == 8080; print('Docker container OK')"
