name: CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install "pytest>=8.0.0"
      - name: Run release verification tests
        run: |
          python -m pytest \
            tests/test_edge_governance.py \
            apex_sharpe/tests/test_webhooks.py \
            apex_sharpe/tests/test_unusual_whales.py \
            apex_sharpe/tests/test_ops_agents.py \
            -q --tb=short

  publish-container:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Write deployment summary
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Container Published"
            echo ""
            echo "- Digest: \`${IMAGE_DIGEST}\`"
            echo "- Tags:"
            echo "\`\`\`"
            echo "${IMAGE_TAGS}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    runs-on: ubuntu-latest
    needs: publish-container
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Send deployment webhook notification
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          DEPLOY_RESULT: ${{ needs.publish-container.result }}
          REPO_NAME: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "WEBHOOK_URL secret is not set; skipping deployment webhook notification."
            exit 0
          fi
          python - << 'EOF'
          import os
          import sys
          from apex_sharpe.config import WebhookCfg
          from apex_sharpe.webhooks import WebhookClient

          status = os.environ["DEPLOY_RESULT"]
          repo_name = os.environ["REPO_NAME"]
          ref_name = os.environ["REF_NAME"]
          commit_sha = os.environ["COMMIT_SHA"]
          run_url = os.environ["RUN_URL"]
          severity = "SUCCESS" if status == "success" else "FAIL"
          urls = tuple(u.strip() for u in os.environ["WEBHOOK_URL"].split(",") if u.strip())
          client = WebhookClient(WebhookCfg(urls=urls, secret=os.environ.get("WEBHOOK_SECRET", "")))
          results = client.send(
              event="cd.deploy",
              title=f"CD Publish: {status.upper()}",
              message=f"{repo_name} ({ref_name}) finished with status {status}.",
              subtitle=commit_sha[:8],
              severity=severity,
              data={"ref": ref_name, "sha": commit_sha, "run_url": run_url},
          )
          for r in results:
              print(f"{r.url}: ok={r.ok} status={r.status_code} error={r.error}")
          if any(not r.ok for r in results):
              sys.exit(1)
          EOF
